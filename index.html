<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#2F6FED">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#12151c">
<meta name="description" content="国科大人的课表工具：粘贴课程代码 3 秒生成整学期课表，笔记 / 作业 / 考试一站管理，云同步互通，可安装成手机 App。">
<meta property="og:title" content="课表 · 国科大课程表">
<meta property="og:description" content="粘贴课程代码，3 秒生成整学期课表；笔记 / 作业 DDL / 考试一站管理，还能装成手机 App。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://jiad88376-coder.github.io/kebiao-ucas/">
<meta property="og:image" content="https://jiad88376-coder.github.io/kebiao-ucas/icons/icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="课表">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png">
<title>课表 · 国科大课程表</title>
<script>
try {
  var _t = localStorage.getItem("kebiao:theme");
  var _d = _t === "dark" || (_t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = _d ? "dark" : "light";
} catch (e) {}
</script>
<link rel="stylesheet" href="./style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">课</span>
    <span class="brand-col">
      <span class="brand-text">课表</span>
      <span id="termBadge" class="term-badge"></span>
    </span>
  </div>
  <div class="top-actions">
    <button id="btnForum" class="icon-btn talk-btn" title="自由论坛"><span class="ib-ico">💬</span><span class="ib-label">论坛</span></button>
    <button id="btnLogin" class="icon-btn" title="登录云同步"><span class="ib-ico">☁</span><span class="ib-label">登录</span></button>
    <button id="btnMore" class="icon-btn" title="更多"><span class="ib-ico more-ico">⋯</span><span class="ib-label">更多</span></button>
    <button id="btnShare" class="icon-btn" title="推荐给同学"><span class="ib-ico">↗</span><span class="ib-label">分享</span></button>
    <button id="btnTheme" class="icon-btn theme-btn" title="切换深浅色">🌗</button>
  </div>
</header>

<!-- 学校选择（新用户首次） -->
<section id="schoolPick" class="hidden">
  <h1>选择你的学校</h1>
  <p class="hint">加载该校的课程库与校历，之后无需再选</p>
  <div class="searchbox">
    <input id="schoolSearch" placeholder="🔍 搜索学校…" autocomplete="off">
  </div>
  <div id="schoolList" class="school-list"></div>
  <p class="footnote">没找到你的学校？联系管理员即可添加</p>
</section>

<!-- 空状态 / 欢迎页 -->
<section id="welcome" class="welcome hidden">
  <h1>生成你的专属课表</h1>
  <p class="hint">把选课系统里的<b>课程代码</b>粘贴进来（每行一个），或者直接搜索课程名称添加。</p>
  <textarea id="codeInput" spellcheck="false" placeholder="例如：&#10;180081070200P1001H-1&#10;180081070202P3007H&#10;180087120200MX016H"></textarea>
  <button id="btnGenerate" class="primary">生成课表</button>
  <div class="divider"><span>或</span></div>
  <div class="searchbox">
    <input id="welcomeSearch" placeholder="🔍 搜索课程名称 / 课程代码…" autocomplete="off">
    <div id="welcomeSug" class="suggestions"></div>
  </div>
  <p class="footnote">数据仅供参考，以教务系统为准 · 课表只保存在本机浏览器</p>
</section>

<!-- 主界面 -->
<main id="main" class="hidden">
  <div class="searchbar">
    <input id="searchInput" placeholder="🔍 添加课程：搜索名称或代码" autocomplete="off">
    <div id="suggestions" class="suggestions"></div>
  </div>
  <div id="banner" class="banner hidden"></div>

  <div class="weekbar" id="weekbar">
    <button id="wkPrev" class="wk-btn" aria-label="上一周">‹</button>
    <button id="wkLabel" class="wk-label"></button>
    <button id="wkNext" class="wk-btn" aria-label="下一周">›</button>
    <button id="wkAll" class="wk-all">全部周次</button>
  </div>

  <div class="daytabs" id="daytabs"></div>

  <div class="gridwrap" id="gridwrap">
    <table id="grid"></table>
    <div id="gridEmpty" class="grid-empty hidden">本周没有安排课程<br><span>点上方「全部周次」可查看整学期课表</span></div>
  </div>

  <div class="legend">
    <span class="lg"><i class="dot" style="background:#E3EFFC"></i>核心/学科</span>
    <span class="lg"><i class="dot" style="background:#FCF1E3"></i>专业</span>
    <span class="lg"><i class="dot" style="background:#FBEBF2"></i>公共</span>
    <span class="lg"><i class="dot" style="background:#E4F4F2"></i>研讨</span>
    <span class="lg"><i class="dot" style="background:#F6F1DE"></i>实验/实践</span>
    <span class="lg"><i class="conflict-mark"></i>时间冲突</span>
  </div>
  <footer class="footnote">数据仅供参考，以教务系统为准 · 课表仅存本机浏览器，请定期备份</footer>
</main>

<!-- 论坛 -->
<section id="forum" class="hidden">
  <div class="forum-head" id="forumHead"></div>
  <div id="forumBody" class="forum-body"></div>
</section>

<!-- 课程详情抽屉 -->
<div id="overlay" class="overlay hidden"></div>
<div id="drawer" class="drawer hidden"></div>

<!-- 通用弹窗 -->
<div id="modal" class="modal hidden"></div>

<!-- 隐藏元素 -->
<input type="file" id="fileImport" accept=".json" hidden>
<div id="toast" class="toast"></div>

<script src="./vendor/supabase.min.js"></script>
<script src="./app.js"></script>
</body>
</html>
