<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录中 · 课表</title>
<style>
  body { font-family: -apple-system, "PingFang SC", sans-serif; display: flex; align-items: center;
    justify-content: center; min-height: 100vh; margin: 0; background: #f5f6fa; color: #1f2329; }
  .card { text-align: center; padding: 24px; max-width: 320px; }
  .logo { width: 56px; height: 56px; border-radius: 14px; background: #2F6FED; color: #fff;
    font-size: 26px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px; }
  #msg { font-size: 14px; color: #8a919c; line-height: 1.7; }
  a { color: #2F6FED; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">课</div>
  <div id="msg">正在登录…</div>
</div>
<script src="./vendor/supabase.min.js"></script>
<script>
  (function () {
    var SUPABASE_URL = (location.hostname.endsWith("netlify.app"))
      ? location.origin + "/.netlify/functions/supabase"
      : "https://kebiao-ucas.netlify.app/.netlify/functions/supabase";
    var KEY = "sb_publishable_ONe5Ft1rxeRt-rcdruXYoQ_sM0jgwLn";
    var msg = document.getElementById("msg");
    var client = supabase.createClient(SUPABASE_URL, KEY);
    var qs = new URLSearchParams(location.search);
    var code = qs.get("code");
    if (!code) {
      msg.innerHTML = "链接无效或已过期<br><a href=\"./\">返回课表</a>";
      return;
    }
    client.auth.exchangeCodeForSession(code).then(function (res) {
      if (res.error) {
        msg.innerHTML = "登录失败：" + (res.error.message || res.error) + "<br><a href=\"./\">返回重试</a>";
        return;
      }
      msg.textContent = "登录成功，正在跳转…";
      location.href = location.pathname.replace(/auth-callback\.html$/, "");
    }).catch(function (e) {
      msg.innerHTML = "登录失败：" + e.message + "<br><a href=\"./\">返回重试</a>";
    });
  })();
</script>
</body>
</html>
